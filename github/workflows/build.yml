name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Compiler
        run: mvn -B -f "$(find . -path '*/Arbres/pom.xml' | head -1)" package
      - uses: actions/upload-artifact@v4
        with:
          name: Arbres-jar
          path: '**/target/Arbres-*.jar'
